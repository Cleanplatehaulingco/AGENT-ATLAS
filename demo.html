    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className={`card-glass rounded-2xl p-6 ${wide ? "w-full max-w-2xl" : "w-full max-w-md"} max-h-[90vh] overflow-y-auto animate-fade mx-4`}>
        <div className="flex justify-between items-center mb-5">
          <h3 className="text-white font-bold text-lg">{title}</h3>
          <button onClick={onClose} className="text-violet-400 hover:text-white text-2xl leading-none">&times;</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FormField({ label, type="text", value, onChange, options, placeholder, rows }) {
  const base = "w-full rounded-lg px-3 py-2 text-sm";
  if (type === "select") return (
    <div className="mb-4">
      <label className="block text-violet-300 text-xs font-semibold mb-1 uppercase tracking-wide">{label}</label>
      <select className={base} value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
  if (type === "textarea") return (
    <div className="mb-4">
      <label className="block text-violet-300 text-xs font-semibold mb-1 uppercase tracking-wide">{label}</label>
      <textarea className={base} rows={rows||3} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}></textarea>
    </div>
  );
  return (
    <div className="mb-4">
      <label className="block text-violet-300 text-xs font-semibold mb-1 uppercase tracking-wide">{label}</label>
      <input type={type} className={base} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
    </div>
  );
}

// ── Revenue Page ──────────────────────────────────────────────────────────────
function Revenue() {
  const totalRevenue = REVENUE_DATA.reduce((s,m) => s+m.Etsy+m.Market+m.Marketplace, 0);
  const totalExpenses = EXPENSES.reduce((s,e) => s+e.amount, 0);
  const profit = totalRevenue - totalExpenses;

  const bestMonth = REVENUE_DATA.reduce((best, m) => {
    const t = m.Etsy+m.Market+m.Marketplace;
    return t > best.t ? { name:m.month, t } : best;
  }, { name:"", t:0 });

  const platformTotals = REVENUE_DATA.reduce((acc, m) => {
    acc.Etsy += m.Etsy; acc.Market += m.Market; acc.Marketplace += m.Marketplace;
    return acc;
  }, { Etsy:0, Market:0, Marketplace:0 });

  const bestPlatform = Object.entries(platformTotals).sort((a,b)=>b[1]-a[1])[0];

  const pieData = Object.entries(platformTotals).map(([name, value]) => ({ name, value }));
  const PIE_COLORS = ["#e47911","#7c3aed","#2563eb"];

  function exportCSV() {
    const rows = [["Month","Etsy","Market","Marketplace","Total"],...REVENUE_DATA.map(m=>[m.month,m.Etsy,m.Market,m.Marketplace,m.Etsy+m.Market+m.Marketplace])];
    const csv = rows.map(r=>r.join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = "ravens_revenue.csv";
    a.click();
  }

  return (
    <div className="space-y-6 animate-fade">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon="💵" label="Total Revenue" value={`$${totalRevenue.toLocaleString()}`} sub="Jan–Jun 2026" color="bg-green-900/40" />
        <StatCard icon="📊" label="Total Profit" value={`$${profit.toLocaleString()}`} sub={`After $${totalExpenses} expenses`} color="bg-violet-900/40" />
        <StatCard icon="🏆" label="Best Month" value={bestMonth.name} sub={`$${bestMonth.t.toLocaleString()}`} color="bg-amber-900/40" />
        <StatCard icon="🥇" label="Best Platform" value={bestPlatform[0]} sub={`$${bestPlatform[1].toLocaleString()}`} color="bg-indigo-900/40" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 card-glass rounded-xl p-5">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-amber-400 font-bold text-sm uppercase tracking-wide">Monthly Revenue by Platform</h3>
            <button onClick={exportCSV} className="btn-gold px-3 py-1.5 rounded-lg text-xs">⬇ Export CSV</button>
          </div>
          <ResponsiveContainer width="100%" height={240}>
            <BarChart data={REVENUE_DATA} margin={{ top:5, right:10, left:0, bottom:5 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(124,58,237,0.15)" />
              <XAxis dataKey="month" tick={{ fill:"#c4b5fd", fontSize:12 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill:"#c4b5fd", fontSize:11 }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ background:"#1a0a2e", border:"1px solid #7c3aed", borderRadius:8, color:"#e9d5ff" }} />
              <Legend wrapperStyle={{ color:"#c4b5fd", fontSize:12 }} />
              <Bar dataKey="Etsy" stackId="a" fill="#e47911" radius={[0,0,0,0]} />
              <Bar dataKey="Market" stackId="a" fill="#7c3aed" />
              <Bar dataKey="Marketplace" stackId="a" fill="#2563eb" radius={[4,4,0,0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>

        <div className="card-glass rounded-xl p-5">
          <h3 className="text-amber-400 font-bold text-sm uppercase tracking-wide mb-4">Platform Split</h3>
          <ResponsiveContainer width="100%" height={180}>
            <PieChart>
              <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value">
                {pieData.map((_, i) => <Cell key={i} fill={PIE_COLORS[i]} />)}
              </Pie>
              <Tooltip contentStyle={{ background:"#1a0a2e", border:"1px solid #7c3aed", borderRadius:8, color:"#e9d5ff" }} />

          </ResponsiveContainer>
          <div className="space-y-2 mt-2">

                </div>
                <span className="text-white font-medium">${p.value.toLocaleString()}</span>

            ))}

function AIAssistant() {
  const [messages, setMessages] = useState([
    { role:"ai", text:"Hey Raven! 🌙 I'm your AI business assistant. I know your shop, your products, your customers, and your goals. Ask me anything — or tap one of the quick prompts below to get started!" },
    { role:"user", text:"What were my top sellers last month?" },
    { role:"ai", text:"In May 2026, your top sellers were:\n\n1. 🥇 Purple Amethyst Bracelet — 8 units, $384\n2. 🥈 Moon Phase Necklace — 6 units, $228\n3. 🥉 Moonstone Ring Set — 3 units, $195\n\nEtsy drove the most volume (58%). Your Saturday market on May 31 was your single best sales day of the month — $180 in one day! Consider adding more beaded bracelets to your market display since they sold out fastest." },
    { role:"user", text:"How can I grow my Etsy shop?" },
    { role:"ai", text:"Great question! Here are your top 3 Etsy growth levers right now:\n\n🔍 **SEO:** Add 'healing crystal bracelet' and 'witchy jewelry gift' to your titles — both have 20k+ monthly searches with moderate competition.\n\n📸 **Photos:** Your Black Crystal Choker listing has the lowest click-through. A lifestyle shot (worn on a dark sweater, dramatic lighting) could 2-3x saves.\n\n⭐ **Reviews:** You have 47 sales in 2026 but only 12 reviews. After each sale, send a personal follow-up note — review rates jump from ~8% to ~35% with just one friendly message.\n\nWant me to write that follow-up message for you?" },
  ]);
  const [input, setInput] = useState("");
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior:"smooth" });
  }, [messages]);

  function sendMessage(text) {
    const q = text || input;
    if (!q.trim()) return;
    setMessages(m => [...m, { role:"user", text:q }]);
    setInput("");
    const prompt = QUICK_PROMPTS.find(p => p.label === q);
    setTimeout(() => {
      setMessages(m => [...m, { role:"ai", text: prompt ? prompt.answer : `I'm analyzing your question: "${q}"\n\nBased on your shop data at ravensbaublesngifts, here's what I found:\n\nYour business is performing well overall with $18,420 YTD revenue. The Purple Amethyst Bracelet continues to be your top performer. Would you like me to dive deeper into any specific area — pricing, marketing, inventory, or customer strategy?` }]);
    }, 700);
  }

  return (
    <div className="animate-fade flex flex-col h-full" style={{height:"calc(100vh - 140px)"}}>
      <div className="flex-1 overflow-y-auto space-y-4 mb-4 min-h-0" style={{maxHeight:"calc(100vh - 340px)"}}>
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role==="user"?"justify-end":"justify-start"} animate-fade`}>
            <div className={`max-w-lg px-4 py-3 text-sm leading-relaxed whitespace-pre-line ${m.role==="ai" ? "chat-bubble-ai text-violet-100" : "chat-bubble-user text-amber-100"}`}>
              {m.role==="ai" && <div className="text-amber-400 text-xs font-bold mb-1">Raven's AI ✨</div>}
              {m.text}
            </div>
          </div>
        ))}
        <div ref={bottomRef} />
      </div>

      <div className="card-glass rounded-xl p-4 flex-shrink-0">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 mb-4">
          {QUICK_PROMPTS.map(p => (
            <button key={p.label} onClick={() => sendMessage(p.label)} className="text-left text-xs px-3 py-2 rounded-lg border border-violet-700/50 text-violet-300 hover:bg-violet-900/30 hover:text-white hover:border-violet-500 transition-all leading-tight">
              {p.label}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <input
            type="text"
            className="flex-1 rounded-lg px-4 py-2 text-sm"
            placeholder="Ask anything about your shop…"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && sendMessage()}
          />
          <button onClick={() => sendMessage()} className="btn-purple px-5 py-2 rounded-lg font-bold text-sm">Send</button>
        </div>
      </div>
    </div>
  );
}

              <span className="text-base">{t.icon}</span>
              {t.label}
            </button>
          ))}
        </nav>
        <div className="p-4 border-t border-violet-900/40">
          <div className="text-violet-500 text-xs text-center">✨ Made for Raven</div>
        </div>
      </div>

      {/* Main */}
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* Top bar */}
        <div className="border-b border-violet-900/40 px-4 lg:px-6 py-3 flex items-center justify-between flex-shrink-0" style={{background:"rgba(26,10,46,0.6)"}}>
          <div className="lg:hidden">
            <div className="gem-logo text-lg font-black">Raven's Hub</div>
          </div>
          <div className="hidden lg:block">
            <h1 className="text-white font-bold text-lg">{TABS.find(t=>t.id===tab)?.icon} {TABS.find(t=>t.id===tab)?.label}</h1>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-right hidden sm:block">
              <div className="text-amber-400 text-xs font-bold">Today: $127</div>
              <div className="text-violet-400 text-xs">Jun 2, 2026</div>
            </div>
            <div className="w-8 h-8 rounded-full btn-purple flex items-center justify-center text-sm font-bold">R</div>
          </div>
        </div>

        {/* Mobile nav */}
        <div className="lg:hidden flex overflow-x-auto border-b border-violet-900/40 px-2 py-2 gap-1 flex-shrink-0">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex-shrink-0 flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${tab===t.id ? "tab-active" : "tab-inactive"}`}>
              <span>{t.icon}</span>
              <span className="text-xs">{t.label.split(" ")[0]}</span>
            </button>
          ))}
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto p-4 lg:p-6">
          {page}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
