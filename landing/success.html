<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Ready — TradeOpsVault</title>
  <meta name="robots" content="noindex" />
  <!-- Meta Pixel -->
  <script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0d1526;
      --navy2:  #1a2744;
      --navy3:  #243356;
      --orange: #e85d04;
      --orange2:#f97316;
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* ── Top nav bar ── */
    .topbar {
      width: 100%;
      background: rgba(13,21,38,0.95);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--orange); }

    /* ── Main card ── */
    .card {
      width: 100%;
      max-width: 600px;
      margin: 48px 20px 32px;
      background: var(--navy2);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #1a2744 0%, #243356 100%);
      border-bottom: 1px solid var(--border);
      padding: 36px 40px 32px;
      text-align: center;
      position: relative;
    }

    .check-wrap {
      width: 72px;
      height: 72px;
      background: rgba(232,93,4,0.15);
      border: 2px solid var(--orange);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .card-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .card-header h1 span { color: var(--orange); }

    .template-name {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 0;
    }

    /* ── Download section ── */
    .card-body {
      padding: 36px 40px;
    }

    .download-block {
      background: rgba(232,93,4,0.08);
      border: 1.5px solid rgba(232,93,4,0.3);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      margin-bottom: 32px;
    }

    .download-block p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--orange);
      color: var(--white);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 15px 32px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .btn-download:hover  { background: var(--orange2); transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }

    .download-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Steps ── */
    .steps-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 16px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: rgba(232,93,4,0.15);
      border: 1.5px solid rgba(232,93,4,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--orange);
      margin-top: 1px;
    }

    .step-text strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .step-text span {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ── Footer links ── */
    .card-footer {
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-footer a {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .card-footer a:hover { color: var(--white); }

    .store-btn {
      background: var(--navy3);
      color: var(--white) !important;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.82rem !important;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: border-color 0.15s !important;
    }
    .store-btn:hover { border-color: rgba(255,255,255,0.2) !important; }

    /* ── Upsell card ── */
    .upsell {
      margin-top: 28px;
      background: linear-gradient(135deg, #0f1628 0%, #1a2744 100%);
      border: 1.5px solid rgba(232,93,4,0.35);
      border-radius: 14px;
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
    }
    .upsell::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(232,93,4,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .upsell-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232,93,4,0.15);
      border: 1px solid rgba(232,93,4,0.3);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
    }
    .upsell h3 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .upsell h3 span { color: var(--orange); }
    .upsell p {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .upsell-perks {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 20px;
    }
    .upsell-perk {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .82rem;
      color: rgba(255,255,255,0.8);
    }
    .upsell-perk-dot {
      width: 18px; height: 18px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem;
      color: #10b981;
      flex-shrink: 0;
    }
    .btn-upsell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: var(--white);
      font-size: .9rem;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .1s;
      letter-spacing: -.01em;
      width: 100%;
      justify-content: center;
    }
    .btn-upsell:hover { background: var(--orange2); transform: translateY(-1px); }
    .upsell-note {
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
      margin-top: 10px;
    }

    /* ── No-token state ── */
    .error-state { text-align: center; padding: 48px 40px; }
    .error-state h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .error-state p  { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }

    @media (max-width: 480px) {
      .card-header, .card-body { padding: 28px 24px; }
      .card-footer { padding: 18px 24px; }
      .card-header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">TradeOps<span>Vault</span></div>
  </div>

  <div class="card" id="main-card">
    <!-- content injected by JS -->
  </div>

  <script>
    const BACKEND = 'https://agent-atlas.onrender.com';

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || '';
    }

    const token     = getParam('token');
    const rawName   = getParam('name');
    const itemCount = parseInt(getParam('items') || '1', 10);
    const name      = rawName ? decodeURIComponent(rawName) : 'Your Template';
    const isBundle  = itemCount > 1;

    const card = document.getElementById('main-card');

    if (!token) {
      card.innerHTML = `
        <div class="error-state">
          <div style="font-size:48px;margin-bottom:16px">⚠️</div>
          <h2>No download token found</h2>
          <p>It looks like you landed here without a purchase. If you just completed checkout, please check your browser — Stripe may have been blocked from redirecting.</p>
          <a href="https://tradeopsvault.com/landing/store.html" class="btn-download" style="display:inline-flex;text-decoration:none;">Browse Templates</a>
        </div>`;
    } else {
      // Fire Meta Purchase event
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Purchase', {
          value: isBundle ? 9.99 : 3.99,
          currency: 'USD',
          content_name: name,
          content_type: 'product',
          num_items: itemCount,
        });
      }

      // Fire server-side Meta event
      fetch(`${BACKEND}/meta/event`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          eventName: 'Purchase',
          eventData: { value: isBundle ? 9.99 : 3.99, contentName: name, url: window.location.href },
        }),
      }).catch(() => {});

      const downloadUrl  = `${BACKEND}/shop/download/${token}`;
      const bundleNote   = isBundle
        ? `You'll see a page with download links for all ${itemCount} templates.`
        : `Your template will download immediately as an HTML file. Open it in Chrome, fill it out, and print to PDF.`;

      card.innerHTML = `
        <div class="card-header">
          <div class="check-wrap">✓</div>
          <h1>Payment <span>Confirmed!</span></h1>
          <p class="template-name">${isBundle ? 'Complete Bundle — All 20 Templates' : name}</p>
        </div>
        <div class="card-body">
          <div class="download-block">
            <p>${bundleNote}</p>
            <a href="${downloadUrl}" class="btn-download" id="dl-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ${isBundle ? 'Download All 20 Templates' : 'Download Template Now'}
            </a>
            <p class="download-note">Link valid for 7 days · Unlimited downloads</p>
          </div>

          <p class="steps-title">What to do next</p>
          <div class="steps">
            <div class="step">
              <div class="step-num">1</div>
              <div class="step-text">
                <strong>Open in Chrome or Edge</strong>
                <span>Save the file (Ctrl+S / Cmd+S), then double-click to open in your browser. Works offline.</span>
              </div>
            </div>
            <div class="step">
              <div class="step-num">2</div>
              <div class="step-text">
                <strong>Click any field to type</strong>
                <span>All text boxes are editable. Totals calculate automatically. Type your signature in the signature field.</span>
              </div>
            </div>
            <div class="step">
              <div class="step-num">3</div>
              <div class="step-text">
                <strong>Hit "Analyze with AI" for instant insights</strong>
                <span>Get professional recommendations, margin breakdowns, and next-step suggestions in seconds.</span>
              </div>
            </div>
            <div class="step">
              <div class="step-num">4</div>
              <div class="step-text">
                <strong>Print or save as PDF</strong>
                <span>Ctrl+P / Cmd+P → Save as PDF. Share with clients or keep in your records.</span>
              </div>
            </div>
          </div>
        </div>
          <div class="upsell">
            <div class="upsell-badge">🚀 Limited Offer</div>
            <h3>Want us to set up your<br><span>whole business online?</span></h3>
            <p>We'll build your Google Business profile, a professional booking page, and connect your AI forms — done for you in 48 hours.</p>
            <div class="upsell-perks">
              <div class="upsell-perk"><div class="upsell-perk-dot">✓</div>Professional 1-page contractor website</div>
              <div class="upsell-perk"><div class="upsell-perk-dot">✓</div>Google Business Profile setup &amp; optimized</div>
              <div class="upsell-perk"><div class="upsell-perk-dot">✓</div>AI forms connected &amp; ready to use</div>
              <div class="upsell-perk"><div class="upsell-perk-dot">✓</div>Delivered in 48 hours</div>
            </div>
            <a href="mailto:support@tradeopsvault.com?subject=Done-For-You%20Setup%20Inquiry&body=Hi%2C%20I%20just%20purchased%20a%20template%20and%20I'm%20interested%20in%20the%20done-for-you%20setup." class="btn-upsell">
              Get My Business Set Up — $299
            </a>
            <p class="upsell-note">Delivered in 48 hours · 100% done for you · Money-back guarantee</p>
          </div>
        </div>
        <div class="card-footer">
          <a href="mailto:support@tradeopsvault.com">Need help?</a>
          <a href="https://tradeopsvault.com/landing/store.html" class="store-btn">Browse More Templates →</a>
        </div>`;
    }
  </script>

</body>
</html>
