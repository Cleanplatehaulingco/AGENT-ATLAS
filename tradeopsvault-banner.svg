<svg xmlns="http://www.w3.org/2000/svg" width="3360" height="840" viewBox="0 0 3360 840">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1220"/>
      <stop offset="50%" style="stop-color:#0d1526"/>
      <stop offset="100%" style="stop-color:#101a2e"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f7cff;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#4f7cff;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#7ba4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7ba4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f7cff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#4f7cff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#1e3054"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="3360" height="840" fill="url(#bg)"/>

  <!-- Subtle radial glow center-left -->
  <ellipse cx="1100" cy="420" rx="900" ry="500" fill="url(#glow)"/>

  <!-- Grid lines — very subtle -->
  <line x1="0" y1="280" x2="3360" y2="280" stroke="rgba(79,124,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="560" x2="3360" y2="560" stroke="rgba(79,124,255,0.04)" stroke-width="1"/>
  <line x1="840" y1="0" x2="840" y2="840" stroke="rgba(79,124,255,0.04)" stroke-width="1"/>
  <line x1="1680" y1="0" x2="1680" y2="840" stroke="rgba(79,124,255,0.04)" stroke-width="1"/>
  <line x1="2520" y1="0" x2="2520" y2="840" stroke="rgba(79,124,255,0.04)" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="3360" height="4" fill="url(#accentLine)"/>

  <!-- Bottom accent line -->
  <rect x="0" y="836" width="3360" height="4" fill="url(#accentLine)"/>

  <!-- ── LOGO MARK (left side) ───────────────────────────────────────── -->
  <g transform="translate(180, 270)">
    <!-- AA left A -->
    <path d="M0 240 L65 0 L130 240" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- AA right A -->
    <path d="M110 240 L175 0 L240 240" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Diagonal crossbar -->
    <line x1="-15" y1="148" x2="255" y2="112" stroke="#7ba4ff" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- ── MAIN HEADLINE ──────────────────────────────────────────────── -->
  <text x="520" y="370" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" fill="white" letter-spacing="-2">TradeOpsVault</text>

  <!-- Blue underline under headline -->
  <rect x="520" y="390" width="1060" height="5" fill="#4f7cff" rx="2"/>

  <!-- ── TAGLINE ─────────────────────────────────────────────────────── -->
  <text x="522" y="470" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="rgba(255,255,255,0.72)" letter-spacing="1">Professional Trade Forms — Ready in 60 Seconds</text>

  <!-- ── TRADE PILLS ─────────────────────────────────────────────────── -->
  <!-- Row of trade category pills -->

  <!-- HVAC -->
  <rect x="522" y="530" width="164" height="52" rx="26" fill="url(#pillBg)" stroke="rgba(79,124,255,0.35)" stroke-width="1.5"/>
  <text x="604" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7ba4ff" text-anchor="middle" letter-spacing="1">HVAC</text>

  <!-- Plumbing -->
  <rect x="700" y="530" width="210" height="52" rx="26" fill="url(#pillBg)" stroke="rgba(79,124,255,0.35)" stroke-width="1.5"/>
  <text x="805" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7ba4ff" text-anchor="middle" letter-spacing="1">PLUMBING</text>

  <!-- Electrical -->
  <rect x="924" y="530" width="228" height="52" rx="26" fill="url(#pillBg)" stroke="rgba(79,124,255,0.35)" stroke-width="1.5"/>
  <text x="1038" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7ba4ff" text-anchor="middle" letter-spacing="1">ELECTRICAL</text>

  <!-- Roofing -->
  <rect x="1166" y="530" width="196" height="52" rx="26" fill="url(#pillBg)" stroke="rgba(79,124,255,0.35)" stroke-width="1.5"/>
  <text x="1264" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7ba4ff" text-anchor="middle" letter-spacing="1">ROOFING</text>

  <!-- Pool -->
  <rect x="1376" y="530" width="144" height="52" rx="26" fill="url(#pillBg)" stroke="rgba(79,124,255,0.35)" stroke-width="1.5"/>
  <text x="1448" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7ba4ff" text-anchor="middle" letter-spacing="1">POOL</text>

  <!-- + 15 More -->
  <rect x="1534" y="530" width="210" height="52" rx="26" fill="rgba(79,124,255,0.15)" stroke="rgba(79,124,255,0.5)" stroke-width="1.5"/>
  <text x="1639" y="563" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">+ 15 MORE</text>

  <!-- ── RIGHT SIDE — VALUE PROPS ────────────────────────────────────── -->
  <g transform="translate(2400, 0)">

    <!-- Card 1 -->
    <rect x="0" y="160" width="380" height="140" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(79,124,255,0.2)" stroke-width="1.5"/>
    <text x="190" y="228" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">20</text>
    <text x="190" y="272" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle">Ready-to-Use Templates</text>

    <!-- Card 2 -->
    <rect x="420" y="160" width="380" height="140" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(79,124,255,0.2)" stroke-width="1.5"/>
    <text x="610" y="222" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">NO SOFTWARE</text>
    <text x="610" y="262" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">NEEDED</text>
    <text x="610" y="290" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.45)" text-anchor="middle">Opens in any browser</text>

    <!-- Card 3 -->
    <rect x="0" y="330" width="380" height="140" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(79,124,255,0.2)" stroke-width="1.5"/>
    <text x="190" y="392" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">INSTANT</text>
    <text x="190" y="432" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">DOWNLOAD</text>
    <text x="190" y="460" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.45)" text-anchor="middle">Print or fill on screen</text>

    <!-- Card 4 -->
    <rect x="420" y="330" width="380" height="140" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(79,124,255,0.2)" stroke-width="1.5"/>
    <text x="610" y="398" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#7ba4ff" text-anchor="middle">$3.99</text>
    <text x="610" y="438" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle">Per template</text>
    <text x="610" y="466" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.35)" text-anchor="middle">Instant value</text>

  </g>

  <!-- Bottom tagline -->
  <text x="1680" y="780" font-family="Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="6">TRADEOPSVAULT · ETSY DIGITAL DOWNLOADS · PROFESSIONAL TRADE FORMS</text>

</svg>
